# Python is only used to build the documentation site (MkDocs); Aletheia itself is written in Go
[project]
name = "aletheia-docs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
docs = [
    "markdown-callouts>=0.4.0",
    "mkdocs-git-revision-date-localized-plugin>=1.6.0",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-material>=9.7.7",
    "selectolax<1",  # mkdocs-glightbox 0.5.2 (latest) drops every image from the page with selectolax 1.x
]
