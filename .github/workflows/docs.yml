# Builds the MkDocs site and publishes it to GitHub Pages (site_url in mkdocs.yml)
# Requires Settings > Pages > Build and deployment > Source: GitHub Actions
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:              # allows running it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits instead of cancelling the running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # full history, for the "Last update" dates (git-revision-date-localized)
          submodules: true        # docs/patterns.md includes code from blueprint/ (check_paths fails without it)
      - uses: astral-sh/setup-uv@v6
      - run: make docs-build      # mkdocs build --strict into site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
